---
- name: Sélectionner les chemins des certificats
  ansible.builtin.set_fact:
    tls_certificate: '{{ "/etc/letsencrypt/live/" ~ certificate_name ~ "/fullchain.pem" if tls_mode == "letsencrypt" else "/etc/knowledge/tls/" ~ certificate_name ~ ".crt" }}'
    tls_key: '{{ "/etc/letsencrypt/live/" ~ certificate_name ~ "/privkey.pem" if tls_mode == "letsencrypt" else "/etc/knowledge/tls/" ~ certificate_name ~ ".key" }}'

- name: Vérifier la présence du certificat
  ansible.builtin.stat:
    path: '{{ tls_certificate }}'
  register: certificate

- name: Préparer le challenge HTTP sans exposer de contenu
  ansible.builtin.template:
    src: nginx-http.conf.j2
    dest: /etc/nginx/sites-available/knowledge.conf
    mode: '0644'
  when: not certificate.stat.exists
  notify: Reload web server

- name: Activer le site Nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/knowledge.conf
    dest: /etc/nginx/sites-enabled/knowledge.conf
    state: link
  notify: Reload web server

- name: Désactiver le site Nginx Debian par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload web server

- name: Activer Nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Appliquer le site HTTP
  ansible.builtin.meta: flush_handlers

- name: Obtenir le certificat public
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - -w
      - /var/www/knowledge-acme
      - --non-interactive
      - --agree-tos
      - --email
      - '{{ certificate_email }}'
      - --cert-name
      - '{{ certificate_name }}'
      - -d
      - '{{ git_domain }}'
      - -d
      - '{{ docs_domain }}'
    creates: '{{ tls_certificate }}'
  when: tls_mode == 'letsencrypt'

- name: Créer le dossier TLS automatique
  ansible.builtin.file:
    path: /etc/knowledge/tls
    state: directory
    mode: '0700'
  when: tls_mode == 'selfsigned'

- name: Créer un certificat HTTPS auto-signé
  ansible.builtin.command:
    argv: [openssl, req, -x509, -newkey, 'rsa:3072', -nodes, -days, '3650', -keyout, '{{ tls_key }}', -out, '{{ tls_certificate }}', -subj, '/CN={{ docs_domain }}', -addext, 'subjectAltName={{ "IP" if git_domain is match("^[0-9.]+$") else "DNS" }}:{{ git_domain }},{{ "IP" if docs_domain is match("^[0-9.]+$") else "DNS" }}:{{ docs_domain }}']
    creates: '{{ tls_certificate }}'
  when: tls_mode == 'selfsigned'

- name: Installer le site HTTPS
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/knowledge.conf
    mode: '0644'
  notify: Reload web server

- name: Créer le dossier des hooks de renouvellement TLS
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: '0755'
  when: tls_mode == 'letsencrypt'

- name: Installer le hook de renouvellement TLS
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/knowledge-nginx
    content: "#!/bin/sh\nnginx -t && systemctl reload nginx\n"
    mode: '0755'
  when: tls_mode == 'letsencrypt'

- name: Activer le renouvellement des certificats
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started
  when: tls_mode == 'letsencrypt'

- name: Appliquer HTTPS
  ansible.builtin.meta: flush_handlers

- name: Vérifier la documentation publiée
  ansible.builtin.uri:
    url: 'https://127.0.0.1:{{ docs_https_port }}/'
    headers: {Host: '{{ docs_domain }}'}
    validate_certs: false
    status_code: 200

- name: Supprimer les anciens identifiants Basic Auth
  ansible.builtin.file:
    path: /etc/nginx/knowledge.htpasswd
    state: absent

- name: Afficher les accès
  ansible.builtin.debug:
    msg:
      - 'Forgejo : {{ git_url }}/'
      - 'Documentation : {{ docs_url }}/ (accès sans authentification)'
      - 'Clone : {{ git_url }}/{{ forgejo_admin_user }}/{{ knowledge_repo }}.git'
      - 'Certificat public à importer sur les postes : {{ tls_certificate }}'
      - 'Sauvegarde locale quotidienne ; activer Restic pour une copie extérieure.'

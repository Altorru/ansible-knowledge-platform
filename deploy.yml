---
- name: Déployer la plateforme documentaire autonome
  hosts: knowledge
  become: true
  gather_facts: false
  pre_tasks:
    - name: Saisir le mot de passe initial Forgejo
      ansible.builtin.pause:
        prompt: Mot de passe initial Forgejo (16 caractères minimum)
        echo: false
      register: admin_password_prompt
      when: vault_forgejo_admin_password is not defined and prompted_admin_password is not defined
      no_log: true
    - name: Saisir le mot de passe de consultation
      ansible.builtin.pause:
        prompt: Mot de passe de consultation du site (16 caractères minimum)
        echo: false
      register: docs_password_prompt
      when: vault_docs_password is not defined and prompted_docs_password is not defined
      no_log: true
    - name: Vérifier la cible sans Python
      ansible.builtin.raw: |
        set -eu
        . /etc/os-release
        test "$ID" = debian || { echo 'Ce dépôt cible Debian uniquement' >&2; exit 1; }
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-apt
          echo BOOTSTRAPPED
        fi
      register: bootstrap
      changed_when: "'BOOTSTRAPPED' in bootstrap.stdout"
      when: not ansible_check_mode
    - name: Collecter les informations système
      ansible.builtin.setup:
    - name: Charger les secrets saisis
      ansible.builtin.set_fact:
        forgejo_admin_password: "{{ vault_forgejo_admin_password | default(prompted_admin_password | default((admin_password_prompt | default({})).get('user_input', ''))) }}"
        docs_password: "{{ vault_docs_password | default(prompted_docs_password | default((docs_password_prompt | default({})).get('user_input', ''))) }}"
      no_log: true
    - name: Valider la configuration avant toute installation
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version | int >= 12
          - ansible_facts.architecture in ['x86_64', 'aarch64']
          - git_domain is match('^[a-z0-9][a-z0-9.-]+[a-z0-9]$')
          - docs_domain is match('^[a-z0-9][a-z0-9.-]+[a-z0-9]$')
          - "'.invalid' not in git_domain and '.invalid' not in docs_domain"
          - git_domain != docs_domain
          - tls_mode in ['letsencrypt', 'selfsigned']
          - forgejo_admin_user is match('^[a-z][a-z0-9_-]+$')
          - knowledge_repo is match('^[a-z][a-z0-9_-]+$')
          - knowledge_branch == 'main'
          - forgejo_admin_password | length >= 16
          - docs_password | length >= 16
          - "tls_mode != 'letsencrypt' or '.invalid' not in certificate_email"
          - "not backup_restic_repository or vault_restic_password | default('') | length >= 16"
        fail_msg: 'Renseigner la cible, les domaines et des mots de passe de 16 caractères minimum. Debian 12+ requis.'
      no_log: true
  roles:
    - platform

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
password_mechanism = ssh_askpass
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive

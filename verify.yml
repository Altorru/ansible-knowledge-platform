---
- name: Vérifier les services sur le serveur
  hosts: knowledge
  become: true
  gather_facts: false
  pre_tasks:
    - name: Saisir le mot de passe du site si absent de Vault
      ansible.builtin.pause:
        prompt: Mot de passe de consultation du site
        echo: false
      register: verify_password_prompt
      when: vault_docs_password is not defined and prompted_docs_password is not defined
      no_log: true
  tasks:
    - name: Vérifier les services et timers
      ansible.builtin.command:
        argv: [systemctl, is-active, '{{ item }}']
      loop: [forgejo.service, nginx.service, knowledge-publish.timer, knowledge-backup.timer]
      changed_when: false
    - name: Vérifier le site publié localement avec TLS
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: '{{ docs_domain }}'
        url_username: docs
        url_password: "{{ vault_docs_password | default(prompted_docs_password | default((verify_password_prompt | default({})).get('user_input', ''))) }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      no_log: true
    - name: Vérifier le commit publié
      ansible.builtin.command: cat /srv/knowledge/current/commit.txt
      changed_when: false

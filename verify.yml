---
- name: Vérifier les services sur le serveur
  hosts: knowledge
  become: "{{ ansible_user | default('root') != 'root' }}"
  gather_facts: false
  roles:
    - role: platform
      tags: [never]
  tasks:
    - name: Vérifier les services et timers
      ansible.builtin.command:
        argv: [systemctl, is-active, '{{ item }}']
      loop: [forgejo.service, nginx.service, knowledge-publish.timer, knowledge-backup.timer]
      changed_when: false
    - name: Vérifier le site publié localement avec TLS
      ansible.builtin.uri:
        url: 'https://127.0.0.1:{{ docs_https_port }}/'
        headers:
          Host: '{{ docs_domain }}'
        validate_certs: false
        status_code: 200
    - name: Vérifier le commit publié
      ansible.builtin.command: cat /srv/knowledge/current/commit.txt
      changed_when: false
